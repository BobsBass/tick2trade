name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-sim:
    name: Verilator lint + cocotb regression
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version

      - name: Install Python dependencies (venv, same as local)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Lint RTL + run regression
        run: |
          source .venv/bin/activate
          ./scripts/ci_check.sh

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms
          path: |
            **/*.fst
            **/*.vcd
            **/results.xml
          if-no-files-found: ignore
          retention-days: 7
