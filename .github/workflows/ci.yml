name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-sim:
    name: Verilator lint + cocotb regression
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint RTL + run regression
        run: ./scripts/ci_check.sh

      - name: Upload waveforms on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waveforms
          path: |
            **/*.fst
            **/*.vcd
            **/results.xml
          if-no-files-found: ignore
          retention-days: 7
